{{ $isLocal := (or (eq .Site.BaseURL "/") (strings.Contains .Site.BaseURL "localhost")) }}
{{ $locationPrefix := .Site.Params.uniNavHeaderLocationPrefix }}
{{ $logoIcon := .Site.Params.uniNavHeaderLogoIcon | default "https://qgis.org/funders/qgis-usergroup-switzerland.png" }}


<qg-top-nav
    breakpoint="1024"
    class="is-highest navbar is-fixed-top"
    location-prefix="{{ $locationPrefix }}"
    logo-icon="{{ $logoIcon | absURL }}"
    logo-link="{{ .Site.BaseURL }}"
    {{/* The component concatenates second-menu-prefix + href (hrefs in
        static/config/navigation.json start with '/'), hence TrimSuffix to
        avoid double slashes. secondary-menu-config is the local Austrian
        navigation.json, not the upstream template's. */}}
    second-menu-prefix="{{ strings.TrimSuffix "/" .Site.BaseURL }}"
    secondary-menu-config="{{ absURL "config/navigation.json" }}"
></qg-top-nav>
